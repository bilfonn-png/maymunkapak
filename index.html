<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaymunKapak — YouTube thumbnail maker</title>
  <meta name="description" content="Type your video title and get 6 ready YouTube thumbnails. Works in your browser, free." />
  <link rel="icon" href="icons/icon-48.png" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async data-web-only></script>
</head>
<body>
  <header class="topbar">
    <a class="home" id="homeLink" href="./" title="Home">
      <span class="logo">
        <svg viewBox="0 0 64 64" width="34" height="34">
          <rect x="30" y="34" width="26" height="19" rx="3" fill="#fff" stroke="#5b3b1e" stroke-width="2"/>
          <circle cx="38" cy="42" r="3" fill="#ffd23f"/>
          <path d="M33 51l6-6 4 3 5-5 5 5v3H33z" fill="#7ec8e3"/>
          <ellipse cx="12" cy="24" rx="7" ry="8" fill="#8b5a2b"/><ellipse cx="12" cy="24" rx="3.5" ry="4.5" fill="#e8b98a"/>
          <ellipse cx="34" cy="24" rx="7" ry="8" fill="#8b5a2b"/><ellipse cx="34" cy="24" rx="3.5" ry="4.5" fill="#e8b98a"/>
          <ellipse cx="23" cy="26" rx="15" ry="14" fill="#8b5a2b"/>
          <ellipse cx="23" cy="30" rx="11" ry="10" fill="#e8b98a"/>
          <circle cx="18" cy="26" r="2.4" fill="#3a2414"/><circle cx="28" cy="26" r="2.4" fill="#3a2414"/>
          <ellipse cx="20" cy="33" rx="1.6" ry="1.1" fill="#3a2414"/><ellipse cx="26" cy="33" rx="1.6" ry="1.1" fill="#3a2414"/>
          <path d="M19 36q4 3 8 0" stroke="#3a2414" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="brand"><h1>MaymunKapak <span class="plan" id="planBadge"></span></h1><p data-i18n="tagline"></p></div>
    </a>
    <div class="top-actions">
      <button class="btn-pro" id="proBtn" type="button" data-i18n="getCredits"></button>
      <select id="langSel" class="lang-sel" aria-label="Language">
        <option value="en">EN</option>
        <option value="tr">TR</option>
      </select>
    </div>
  </header>

  <!-- ========== HOME: 2 CHOICES ========== -->
  <div class="wrap" id="viewHome">
    <h2 class="headline" data-i18n="homeTitle"></h2>
    <p class="sub" data-i18n="homeSub"></p>
    <div class="choice">
      <button class="choice-card" id="goManual">
        <div class="ci">✏️</div>
        <h3 data-i18n="manualTitle"></h3>
        <p data-i18n-html="manualDesc"></p>
        <span class="cta" data-i18n="start"></span>
      </button>
      <button class="choice-card yt" id="goChannel">
        <div class="ci">🔗🐵</div>
        <h3><span data-i18n="channelTitle"></span></h3>
        <p data-i18n-html="channelDesc"></p>
        <span class="cta" data-i18n="connectCta"></span>
      </button>
    </div>
    <p class="hint" data-i18n="homeHint"></p>
    <p class="hint ext-only" hidden><a href="index.html" target="_blank" id="openFull" data-i18n="openFull"></a></p>
  </div>

  <!-- ========== MAKE IT YOURSELF ========== -->
  <div class="wrap" id="viewManual" hidden>
    <button class="back" data-home data-i18n="back"></button>
    <h2 class="headline" data-i18n="manualHeadline"></h2>

    <div class="step">
      <h2><span class="step-no">1</span> <span data-i18n="step1"></span></h2>
      <input id="title" class="big-input" maxlength="60" data-i18n-ph="titlePh" />
      <input id="subtitle" class="small-input" maxlength="40" data-i18n-ph="subPh" />
      <div class="fmt-row">
        <button class="fmt-btn active" data-fmt="landscape" data-i18n="fmtLandscape"></button>
        <button class="fmt-btn" data-fmt="vertical"><span data-i18n="fmtVertical"></span></button>
      </div>
    </div>

    <div class="step">
      <h2><span class="step-no">2</span> <span data-i18n="step2"></span>&nbsp;<em class="opt" data-i18n="optional"></em></h2>
      <input id="photo" type="file" accept="image/*" hidden />
      <label class="photo-drop" id="photoDrop" for="photo">
        <span class="pd-ico">📷</span>
        <span class="pd-title" data-i18n="photoTitle"></span>
        <span class="pd-sub" id="photoSub" data-i18n="photoSub"></span>
      </label>
      <div class="photo-preview" id="photoPreview">
        <img id="photoThumb" alt="" />
        <div class="pp-txt"><b data-i18n="photoAdded"></b><span class="cut-status" id="cutStatus"></span></div>
        <button class="photo-clear" id="photoClear" type="button" data-i18n="remove"></button>
      </div>
    </div>

    <div class="step">
      <h2><span class="step-no">3</span> <span data-i18n="step3"></span></h2>
      <div id="covers" class="covers"></div>
      <p class="hint" data-i18n-html="coversHint"></p>
    </div>
  </div>

  <!-- ========== CONNECT CHANNEL ========== -->
  <div class="wrap" id="viewChannel" hidden>
    <button class="back" data-home data-i18n="back"></button>

    <div class="connect-hero" id="connectHero">
      <div class="big-emoji">🔗🐵</div>
      <h3 data-i18n="connectHeadline"></h3>
      <p data-i18n="connectBody"></p>
      <button class="btn-yt" id="connectBtn" data-i18n="connectBtn"></button>
      <p class="hint" id="connectNote" data-i18n="connectNote"></p>
    </div>

    <div id="autoResults" hidden>
      <div class="chan-head" id="chanHead"></div>
      <div id="autoCovers" class="covers"></div>
      <p class="hint" id="autoHint"></p>
    </div>
  </div>

  <!-- ========== PRO DIALOG ========== -->
  <dialog id="proDlg" class="pro-dlg">
    <form method="dialog" class="pro-box">
      <p class="pro-locked" id="proLocked" data-i18n="proLocked" hidden></p>
      <h3>⭐ <span data-i18n="proTitle"></span></h3>
      <p data-i18n="proBody"></p>
      <ul class="packs"><li data-i18n="pack1"></li><li data-i18n="pack2"></li></ul>
      <p class="pro-balance" id="proBalance"></p>
      <div id="proBuyRow"><a class="btn-buy" id="proBuy" target="_blank" rel="noopener" data-i18n="proBuy"></a></div>
      <div id="proKeyArea">
        <label for="proKey" data-i18n="proHaveKey"></label>
        <div class="key-row">
          <input id="proKey" class="small-input" autocomplete="off" spellcheck="false" data-i18n-ph="proKeyPh" />
          <button type="button" class="btn-activate" id="proActivate" data-i18n="proActivate"></button>
        </div>
      </div>
      <p class="pro-msg" id="proMsg"></p>
      <button type="button" class="link-btn" id="proDeactivate" data-i18n="proDeactivate" hidden></button>
      <button class="link-btn" value="close" data-i18n="close"></button>
    </form>
  </dialog>

  <footer class="foot" data-i18n="footer"></footer>
  <canvas id="stage"></canvas>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="license.js"></script>
  <script src="app.js"></script>
</body>
</html>
