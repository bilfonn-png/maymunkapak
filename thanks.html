<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you · MaymunKapak Pro</title>
  <link rel="icon" href="icons/icon-48.png" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap shop">
    <h2 class="headline">🎉 Thank you!</h2>
    <p class="sub" id="status">Getting your license key…</p>
    <div class="key-box" id="keyBox" hidden>
      <code id="key"></code>
      <button class="btn-activate" id="copy" type="button">Copy</button>
    </div>
    <ol class="steps" id="steps" hidden>
      <li><b>Save this key</b> somewhere safe (it is also on this page's link: bookmark it).</li>
      <li>Open MaymunKapak (the extension or <a href="./">the website</a>) → <b>⭐ Go Pro</b> → paste the key → <b>Activate</b>.</li>
      <li>You can use the same key on your other browsers.</li>
    </ol>
  </div>
  <script src="config.js"></script>
  <script>
    const txn = new URLSearchParams(location.search).get('txn') || '';
    const $ = id => document.getElementById(id);
    async function claim(tries) {
      try {
        const r = await fetch('/api/claim?txn=' + encodeURIComponent(txn));
        if (r.ok) {
          const { key } = await r.json();
          $('key').textContent = key; $('keyBox').hidden = false; $('steps').hidden = false;
          $('status').textContent = 'Your MaymunKapak Pro license key:';
          try { localStorage.setItem('mk_license', JSON.stringify({ key, active: true, checkedAt: Date.now() })); } catch {}
          return;
        }
      } catch {}
      if (tries > 0) return setTimeout(() => claim(tries - 1), 3000);   // payment may still be processing
      $('status').textContent = 'We could not confirm the payment yet. Refresh this page in a minute. If it still fails, reply to your Paddle receipt email.';
    }
    if (!/^txn_[a-z0-9]+$/.test(txn)) $('status').textContent = 'This link is missing the purchase id.';
    else claim(10);
    $('copy').onclick = () => navigator.clipboard.writeText($('key').textContent).then(() => { $('copy').textContent = 'Copied ✓'; });
  </script>
</body>
</html>
